<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>LCARS - Sean Durgin</title><link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--a:#FF9900;--l:#CC99FF;--b:#6699FF;--r:#FF6666;--bg:#000;--p:#0d0d0d}body{background:var(--bg);color:var(--a);font-family:Antonio,sans-serif;min-height:100vh;display:flex;overflow:hidden}#sb{width:220px;min-height:100vh;display:flex;flex-direction:column;flex-shrink:0}.elbow-t{background:var(--a);height:120px;border-radius:0 0 0 60px;margin-bottom:6px;display:flex;align-items:flex-end;padding:12px 16px}.lt{font-size:.65rem;font-weight:700;color:#000;letter-spacing:.12em;line-height:1.3;text-transform:uppercase}.bar{background:var(--a);height:14px;margin-bottom:6px;border-radius:0 7px 7px 0;width:92%}.bar.l{background:var(--l)}.bar.b{background:var(--b);width:75%}.snav{flex:1;display:flex;flex-direction:column;gap:5px;padding:18px 0}.nb{background:var(--a);color:#000;font-family:Antonio,sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:none;cursor:pointer;padding:10px 16px 10px 20px;text-align:left;border-radius:0 20px 20px 0;width:88%;transition:background .15s,width .15s}.nb:hover,.nb.active{background:var(--l);width:94%}.nb.bb{background:var(--b)}.nb.bb:hover{background:var(--l)}.elbow-b{background:var(--a);height:80px;border-radius:0 60px 0 0;margin-top:6px}#main{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:16px 20px 20px 16px}.tbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}.tb{background:var(--a);height:36px;border-radius:18px}.tb.sh{width:80px}.tb.md{width:160px}.tb.lg{flex:1;background:var(--l)}.tb.sm{width:50px;background:var(--b)}.tlbl{font-size:1.1rem;font-weight:700;letter-spacing:.15em;color:var(--a);text-transform:uppercase;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}.panel{background:var(--p);border:2px solid var(--a);border-radius:12px;display:flex;flex-direction:column;min-height:220px;overflow:hidden;transition:border-color .2s}.panel:hover{border-color:var(--l)}.ph{background:var(--a);color:#000;font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:8px 16px;display:flex;align-items:center;justify-content:space-between}.pd{width:10px;height:10px;border-radius:50%;background:#000;opacity:.4}.panel.lv .ph{background:var(--l)}.panel.bl .ph{background:var(--b)}.pb{flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.pl{background:#1a1a1a;height:12px;border-radius:6px;width:100%}.pl.sh{width:60%}.pl.md{width:80%}.plbl{font-size:.7rem;letter-spacing:.15em;color:#444;text-transform:uppercase;margin-top:12px}.bbar{display:flex;align-items:center;gap:10px;margin-top:18px}.bb2{background:var(--b);height:28px;border-radius:14px}.bb2.lg{flex:1}.bb2.sh{width:60px;background:var(--a)}.bb2.md{width:100px;background:var(--l)}.sd{font-size:.75rem;letter-spacing:.12em;color:var(--b);white-space:nowrap}#main::-webkit-scrollbar{width:6px}#main::-webkit-scrollbar-track{background:#111}#main::-webkit-scrollbar-thumb{background:var(--a);border-radius:3px}</style></head><body><nav id="sb"><div class="elbow-t"><div class="lt">LCARS<br/>PERSONAL<br/>DASHBOARD</div></div><div class="bar"></div><div class="bar l"></div><div class="bar b"></div><div class="snav"><button class="nb active">Dashboard</button><button class="nb bb">Network</button><button class="nb">Domains</button><button class="nb">Audit Log</button><button class="nb">Settings</button></div><div class="bar b"></div><div class="bar l"></div><div class="bar"></div><div class="elbow-b"></div></nav><main id="main"><div class="tbar"><div class="tb sh"></div><div class="tb md"></div><div class="tlbl">DURGIN PERSONAL OPS CENTER</div><div class="tb lg"></div><div class="tb sm"></div></div><div class="grid"><div class="panel"><div class="ph">System Status<div class="pd"></div></div><div class="pb"><div class="pl md"></div><div class="pl sh"></div><div class="pl"></div><div class="pl md"></div><div class="plbl">Awaiting data feed</div></div></div><div class="panel lv"><div class="ph">Family<div class="pd"></div></div><div class="pb"><div class="pl"></div><div class="pl md"></div><div class="pl sh"></div><div class="pl md"></div><div class="plbl">Awaiting data feed</div></div></div><div class="panel bl"><div class="ph">Finance<div class="pd"></div></div><div class="pb"><div class="pl md"></div><div class="pl"></div><div class="pl sh"></div><div class="pl md"></div><div class="plbl">Awaiting data feed</div></div></div><div class="panel lv"><div class="ph">Hollowed Ground<div class="pd"></div></div><div class="pb"><div class="pl sh"></div><div class="pl"></div><div class="pl md"></div><div class="pl sh"></div><div class="plbl">Awaiting data feed</div></div></div><div class="panel"><div class="ph">Certifications<div class="pd"></div></div><div class="pb"><div class="pl"></div><div class="pl md"></div><div class="pl sh"></div><div class="pl"></div><div class="plbl">Awaiting data feed</div></div></div><div class="panel bl"><div class="ph">WGU Progress<div class="pd"></div></div><div class="pb"><div class="pl md"></div><div class="pl sh"></div><div class="pl"></div><div class="pl md"></div><div class="plbl">Awaiting data feed</div></div></div></div><div class="bbar"><div class="bb2 sh"></div><div class="bb2 md"></div><div class="bb2 lg"></div><div class="sd" id="sd">STARDATE -</div></div></main><script>function sd(){const n=new Date(),y=n.getFullYear(),s=new Date(y,0,1),e=new Date(y+1,0,1),f=(n-s)/(e-s);return((y-1987)*1000+f*1000).toFixed(1)}document.getElementById("sd").textContent="STARDATE "+sd();document.querySelectorAll(".nb").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nb").forEach(x=>x.classList.remove("active"));b.classList.add("active")}));</script></body></html>
