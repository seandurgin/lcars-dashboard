<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>LCARS - Sean Durgin</title><link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--a:#FF9900;--l:#CC99FF;--b:#6699FF;--r:#FF6666;--g:#00CC66;--bg:#000;--p:#0d0d0d}body{background:var(--bg);color:var(--a);font-family:Antonio,sans-serif;min-height:100vh;display:flex;overflow:hidden}#sb{width:220px;min-height:100vh;display:flex;flex-direction:column;flex-shrink:0}.elbow-t{background:var(--a);height:120px;border-radius:0 0 0 60px;margin-bottom:6px;display:flex;align-items:flex-end;padding:12px 16px}.lt{font-size:.65rem;font-weight:700;color:#000;letter-spacing:.12em;line-height:1.3;text-transform:uppercase}.bar{background:var(--a);height:14px;margin-bottom:6px;border-radius:0 7px 7px 0;width:92%}.bar.l{background:var(--l)}.bar.b{background:var(--b);width:75%}.snav{flex:1;display:flex;flex-direction:column;gap:5px;padding:18px 0}.nb{background:var(--a);color:#000;font-family:Antonio,sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:none;cursor:pointer;padding:10px 16px 10px 20px;text-align:left;border-radius:0 20px 20px 0;width:88%;transition:background .15s,width .15s}.nb:hover,.nb.active{background:var(--l);width:94%}.nb.bb{background:var(--b)}.nb.bb:hover{background:var(--l)}.elbow-b{background:var(--a);height:80px;border-radius:0 60px 0 0;margin-top:6px}#main{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:16px 20px 20px 16px}#main::-webkit-scrollbar{width:6px}#main::-webkit-scrollbar-track{background:#111}#main::-webkit-scrollbar-thumb{background:var(--a);border-radius:3px}.tbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}.tb{background:var(--a);height:36px;border-radius:18px}.tb.sh{width:80px}.tb.md{width:160px}.tb.lg{flex:1;background:var(--l)}.tb.sm{width:50px;background:var(--b)}.tlbl{font-size:1.1rem;font-weight:700;letter-spacing:.15em;color:var(--a);text-transform:uppercase;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}.panel{background:var(--p);border:2px solid var(--a);border-radius:12px;display:flex;flex-direction:column;min-height:220px;overflow:hidden;transition:border-color .2s}.panel:hover{border-color:var(--l)}.panel.lv .ph{background:var(--l)}.panel.bl .ph{background:var(--b)}.ph{background:var(--a);color:#000;font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:opacity .15s}.ph:hover{opacity:.85}.ph-right{display:flex;align-items:center;gap:8px}.expand-arrow{font-size:.7rem;transition:transform .2s;color:#000}.panel.expanded .expand-arrow{transform:rotate(180deg)}.pd{width:10px;height:10px;border-radius:50%;background:#000;opacity:.4}.pb{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px}.pb-placeholder{flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.pl{background:#1a1a1a;height:12px;border-radius:6px;width:100%}.pl.sh{width:60%}.pl.md{width:80%}.plbl{font-size:.7rem;letter-spacing:.15em;color:#444;text-transform:uppercase;margin-top:12px}.srow{display:flex;align-items:flex-start;gap:10px;font-size:.78rem;letter-spacing:.08em}.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}.dot.green{background:var(--g)}.dot.amber{background:var(--a)}.dot.red{background:var(--r)}.dot.gray{background:#555}.srow-label{color:#888;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;min-width:130px}.srow-val{color:var(--a);flex:1}.detail-block{display:none;padding:4px 0 4px 20px;border-left:2px solid #222;margin:2px 0 6px 4px}.panel.expanded .detail-block{display:block}.drow{font-size:.72rem;color:#888;letter-spacing:.07em;line-height:1.7}.drow span{color:var(--l)}.dev-list{display:flex;flex-direction:column;gap:2px;max-height:120px;overflow-y:auto}.dev-item{display:flex;align-items:center;gap:6px;font-size:.68rem;color:#666}.dev-item .dot{width:7px;height:7px;margin-top:0}.dev-name{color:#999}.fetch-error{color:var(--r);font-size:.75rem;letter-spacing:.12em;text-align:center;padding:20px 0;text-transform:uppercase}.last-updated{font-size:.62rem;color:#333;letter-spacing:.1em;text-align:right;margin-top:auto;padding-top:8px;text-transform:uppercase}.bbar{display:flex;align-items:center;gap:10px;margin-top:18px}.bb2{background:var(--b);height:28px;border-radius:14px}.bb2.lg{flex:1}.bb2.sh{width:60px;background:var(--a)}.bb2.md{width:100px;background:var(--l)}.sd{font-size:.75rem;letter-spacing:.12em;color:var(--b);white-space:nowrap}</style></head><body><nav id="sb"><div class="elbow-t"><div class="lt">LCARS<br/>PERSONAL<br/>DASHBOARD</div></div><div class="bar"></div><div class="bar l"></div><div class="bar b"></div><div class="snav"><button class="nb active">Dashboard</button><button class="nb bb">Network</button><button class="nb">Domains</button><button class="nb">Audit Log</button><button class="nb">Settings</button></div><div class="bar b"></div><div class="bar l"></div><div class="bar"></div><div class="elbow-b"></div></nav><main id="main"><div class="tbar"><div class="tb sh"></div><div class="tb md"></div><div class="tlbl">DURGIN PERSONAL OPS CENTER</div><div class="tb sm"></div><div class="tb md"></div><div class="tb sh"></div></div><div class="grid"><div class="panel" id="panel-system"><div class="ph" onclick="togglePanel('system')">SYSTEM STATUS<div class="ph-right"><div class="pd"></div><span class="expand-arrow">&#9660;</span></div></div><div class="pb" id="pb-system"><div class="fetch-error">AWAITING DATA FEED</div></div></div><div class="panel lv" id="panel-family"><div class="ph" onclick="togglePanel('family')"><span>FAMILY</span><div class="ph-right"><div class="pd"></div><span class="expand-arrow">▼</span></div></div><div class="pb" id="pb-family"><div class="plbl">AWAITING DATA FEED</div></div></div><div class="panel bl" id="panel-finance"><div class="ph" onclick="togglePanel('finance')">FINANCE<div class="ph-right"><span class="expand-arrow">&#9660;</span></div></div><div class="pb" id="pb-finance"><div class="pb-placeholder"><div class="pl"></div><div class="pl md"></div><div class="pl sh"></div><div class="plbl">AWAITING DATA FEED</div></div></div><div class="panel lv"><div class="ph">HOLLOWED GROUND" onclick="togglePanel('hollowed_ground'"><div class="ph-right"><div class="pd"></div><span class="expand-arrow">&#9660;</span></div></div><div class="pb" id="pb-hollowed_ground"><div class="plbl">LOADING...</div></div></div><div class="panel"><div class="ph">CERTIFICATIONS<div class="ph-right"><div class="pd"></div></div></div><div class="pb-placeholder"><div class="pl md"></div><div class="pl sh"></div><div class="pl"></div><div class="plbl">AWAITING DATA FEED</div></div></div><div class="panel bl"><div class="ph">WGU PROGRESS<div class="ph-right"><div class="pd"></div></div></div><div class="pb-placeholder"><div class="pl"></div><div class="pl md"></div><div class="pl sh"></div><div class="plbl">AWAITING DATA FEED</div></div></div></div><div class="bbar"><div class="bb2 sh"></div><div class="bb2 md"></div><div class="bb2 lg"></div><div class="sd" id="stardate">STARDATE --</div><div class="bb2 md"></div><div class="bb2 sh"></div></div></main><script>const expandedPanels=new Set();function togglePanel(k){const p=document.getElementById("panel-"+k);if(!p)return;if(expandedPanels.has(k)){expandedPanels.delete(k);p.classList.remove("expanded");}else{expandedPanels.add(k);p.classList.add("expanded");}}function stardate(){const n=new Date(),yr=n.getFullYear(),s=new Date(yr,0,1),e=new Date(yr+1,0,1),f=(n-s)/(e-s),b=(yr-2323)*1000;return"STARDATE "+(b+f*1000).toFixed(1);}document.getElementById("stardate").textContent=stardate();function cc(o){return o==="green"?"green":o==="amber"?"amber":o==="red"?"red":"gray";}function renderSystem(d){const pb=document.getElementById("pb-system");const svc=d.clawdia_service,vps=d.vps,uni=d.unifi;const uh=Math.floor(svc.detail.uptime_seconds/3600),um=Math.floor((svc.detail.uptime_seconds%3600)/60);const us=uh>0?uh+"h "+um+"m":um+"m";const devHtml=(uni.detail.devices||[]).map(dv=>`<div class="dev-item"><div class="dot ${dv.status==="online"?"green":"red"}"></div><span class="dev-name">${dv.name}</span>&nbsp;<span style="color:#555">${dv.ip||""}</span></div>`).join("");const alHtml=(uni.detail.alerts&&uni.detail.alerts.length)?uni.detail.alerts.map(a=>`<div class="drow" style="color:var(--r)">${a}</div>`).join(""):`<div class="drow">No active alerts</div>`;const ts=new Date(d.checked_at).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});pb.innerHTML=`<div class="srow"><div class="dot ${svc.status==="active"?"green":"red"}"></div><span class="srow-label">CLAWDIA SERVICE</span><span class="srow-val">${svc.status.toUpperCase()}</span></div><div class="detail-block"><div class="drow">Uptime <span>${us}</span></div><div class="drow">Memory <span>${svc.detail.memory_mb.toFixed(1)} MB</span></div><div class="drow">Restarts (24h) <span>${svc.detail.restarts_24h}</span></div><div class="drow">Since <span>${svc.since}</span></div></div><div class="srow"><div class="dot ${cc(vps.overall)}"></div><span class="srow-label">VPS</span><span class="srow-val">${vps.summary}</span></div><div class="detail-block">${vps.detail.disk.map(dk=>`<div class="drow">${dk.path} <span>${dk.pct.toFixed(1)}%</span> (${dk.free_gb.toFixed(1)} GB free)</div>`).join("")}<div class="drow">RAM <span>${vps.detail.ram_used_mb} / ${vps.detail.ram_total_mb} MB</span></div><div class="drow">Load <span>${vps.detail.load_1m} / ${vps.detail.load_5m} / ${vps.detail.load_15m}</span> (1/5/15m)</div></div>` +`<div class="srow"><div class="dot ${cc(uni.overall)}"></div><span class="srow-label">NETWORK</span><span class="srow-val">${uni.summary}</span></div><div class="detail-block"><div class="dev-list">${devHtml}</div><div style="margin-top:6px">${alHtml}</div></div><div class="last-updated">UPDATED ${ts}</div>`;}
function renderFamily(d){
  const pb=document.getElementById("pb-family");
  if(!pb)return;
  const td=d.todos,ms=d.messages,cal=d.calendar;
  const ts=new Date(d.checked_at).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});

  // TODOS detail
  const tdHtml=(td.detail||[]).map(t=>{
    const pri=t.priority?`<span style="color:#555">[${t.priority}]</span> `:"";
    const due=t.due_date?` <span style="color:#555">due ${t.due_date}</span>`:"";
    const cat=t.category?` <span style="color:#888">${t.category}</span>`:"";
    return `<div class="drow">${pri}${t.task}${cat}${due}</div>`;
  }).join("")||"<div class=\"drow\">No open items</div>";

  // MESSAGES detail
  const msHtml=(ms.detail||[]).map(m=>{
    const unr=m.is_unread?` <span style="color:var(--l)">[UNREAD]</span>`:"";
    const txt=(m.text||"").substring(0,80)+(m.text&&m.text.length>80?"…":"");
    return `<div class="drow"><span style="color:var(--a)">${m.sender}</span>${unr}: ${txt}</div>`;
  }).join("")||"<div class=\"drow\">No family messages in last 24h</div>";

  // CALENDAR detail
  const calHtml=(cal.detail||[]).map(e=>{
    const where=e.where?` @ ${e.where}`:"";
    return `<div class="drow"><span style="color:var(--a)">${e.when}</span> — ${e.title}${where}</div>`;
  }).join("")||"<div class=\"drow\">No upcoming events</div>";

  pb.innerHTML=
    `<div class="srow">` +
      `<div class="dot ${cc(td.overall)}"></div>` +
      `<span class="srow-label">TODOS</span>` +
      `<span class="srow-val">${td.summary}</span>` +
    `</div>` +
    `<div class="detail-block">${tdHtml}</div>` +
    `<div class="srow">` +
      `<div class="dot gray"></div>` +
      `<span class="srow-label">MESSAGES</span>` +
      `<span class="srow-val">${ms.summary}</span>` +
    `</div>` +
    `<div class="detail-block">${msHtml}</div>` +
    `<div class="srow">` +
      `<div class="dot gray"></div>` +
      `<span class="srow-label">CALENDAR</span>` +
      `<span class="srow-val">${cal.summary}</span>` +
    `</div>` +
    `<div class="detail-block">${calHtml}</div>` +
    `<div class="last-updated">UPDATED ${ts}</div>`;
}
function fetchFamily(){
  fetch("/api/family").then(r=>{if(!r.ok)throw r.status;return r.json();})
    .then(d=>renderFamily(d))
    .catch(()=>{
      const pb=document.getElementById("pb-family");
      if(pb)pb.innerHTML="<div class=\"fetch-error\">AWAITING DATA FEED</div>";
    });
}
fetchFamily();
setInterval(fetchFamily,60000);
function fetchSystem(){fetch("/api/system-status").then(r=>{if(!r.ok)throw r.status;return r.json();}).then(d=>renderSystem(d)).catch(()=>{document.getElementById("pb-system").innerHTML="<div class=\"fetch-error\">AWAITING DATA FEED</div>";});}fetchSystem();setInterval(fetchSystem,60000);
function renderFinance(d){
  const pb=document.getElementById("pb-finance");
  if(!pb)return;
  const nw=d.net_worth||{}, cf=d.cash_flow||{}, bal=d.balances||{};
  const ts=d.checked_at?new Date(d.checked_at).toLocaleTimeString():"--";

  // detail rows for net worth
  const nwd=nw.detail||{};
  const nw_detail=`
    <div class="drow">Total (vested): <span style="color:var(--a)">$${(nwd.total||0).toLocaleString()}</span></div>
    <div class="drow">With unvested RSU: <span style="color:#888">$${(nwd.with_unvested||0).toLocaleString()}</span></div>
    <div class="drow">Liquid: <span style="color:var(--g)">$${(nwd.liquid||0).toLocaleString()}</span></div>
    <div class="drow">Debt: <span style="color:var(--r)">-$${(nwd.debt||0).toLocaleString()}</span></div>
    <div class="drow">RSU (vested): <span style="color:var(--a)">$${(nwd.rsu_vested||0).toLocaleString()}</span></div>
    <div class="drow">Manual assets: <span style="color:var(--a)">$${(nwd.manual_assets||0).toLocaleString()}</span></div>
    ${nwd.orcl_price?'<div class="drow">ORCL price: <span style="color:var(--a)">$'+nwd.orcl_price.toFixed(2)+'</span></div>':''}
  `;

  // detail rows for cash flow
  const cfd=cf.detail||{};
  const out_rows=(cfd.top_outflows||[]).map(x=>`<div class="drow">${x.merchant}: <span style="color:var(--r)">$${x.amount.toFixed(0)}/mo</span></div>`).join("");
  const inc_rows=(cfd.top_income||[]).map(x=>`<div class="drow">${x.source}: <span style="color:var(--g)">$${x.amount.toFixed(0)}/mo</span></div>`).join("");
  const cf_detail=`<div class="drow" style="color:#888;margin-top:4px">TOP OUTFLOWS</div>${out_rows}<div class="drow" style="color:#888;margin-top:4px">INCOME</div>${inc_rows}`;

  // detail rows for balances
  const bal_rows=(bal.detail||[]).map(a=>a.error
    ?`<div class="drow">${a.institution}: <span style="color:var(--r)">error</span></div>`
    :`<div class="drow">${a.institution} ${a.name} (...${a.mask}): <span style="color:var(--g)">$${a.balance.toLocaleString()}</span></div>`
  ).join("");

  pb.innerHTML=`
    <div class="srow">
      <div class="dot ${nw.overall||'gray'}"></div>
      <span class="srow-label">NET WORTH</span>
      <span class="srow-val">${nw.summary||'--'}</span>
    </div>
    <div class="detail-block" id="db-finance-nw">${nw_detail}</div>
    <div class="srow">
      <div class="dot ${cf.overall||'gray'}"></div>
      <span class="srow-label">CASH FLOW</span>
      <span class="srow-val">${cf.summary||'--'}</span>
    </div>
    <div class="detail-block" id="db-finance-cf">${cf_detail}</div>
    <div class="srow">
      <div class="dot ${bal.overall||'gray'}"></div>
      <span class="srow-label">BALANCES</span>
      <span class="srow-val">${bal.summary||'--'}</span>
    </div>
    <div class="detail-block" id="db-finance-bal">${bal_rows}</div>
    <div class="ts-stamp">Updated ${ts}</div>
  `;
  const panel=document.getElementById("panel-finance");
  if(panel&&panel.classList.contains("expanded")){
    panel.querySelectorAll(".detail-block").forEach(b=>b.style.display="block");
  }
}
function fetchFinance(){
  fetch("/api/finance")
    .then(r=>{if(!r.ok)throw r.status;return r.json();})
    .then(d=>renderFinance(d))
    .catch(()=>{
      const pb=document.getElementById("pb-finance");
      if(pb)pb.innerHTML="<div class=\"fetch-error\">AWAITING DATA FEED</div>";
    });
}
fetchFinance();
setInterval(fetchFinance,300000);
function renderHollowedGround(d){
  var pb=document.getElementById("pb-hollowed_ground");
  if(!pb)return;
  var ch=d.channel||{},cm=d.comments||{},sg=d.song_ideas||{};
  var ts=d.checked_at?new Date(d.checked_at).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"--";
  var vids=(ch.detail&&ch.detail.recent_videos||[]).map(function(v){
    return '<div class="drow"><span style="color:var(--a)">'+v.title+'</span> \u2014 '+v.views.toLocaleString()+' views / '+v.likes+' likes ['+v.published+']</div>';
  }).join("")||'<div class="drow">No video data</div>';
  var chDetail='<div class="drow">Total views: '+((ch.detail&&ch.detail.total_views)||0).toLocaleString()+'</div>'
    +'<div class="drow">Videos: '+((ch.detail&&ch.detail.video_count)||0)+'</div>'+vids;
  var cmHtml=(cm.detail||[]).map(function(c){return '<div class="drow">'+c.raw+'</div>';}).join("")
    ||'<div class="drow">No new comments</div>';
  var sg_d=sg.detail||{};
  var byStage=sg_d.by_stage||{};
  var stageHtml=Object.entries(byStage).filter(function(e){return e[1]>0;})
    .map(function(e){return '<div class="drow"><span style="color:var(--a)">'+e[0]+'</span>: '+e[1]+'</div>';}).join("");
  var recentHtml=(sg_d.recent||[]).map(function(s){
    var moods=s.mood&&s.mood.length?' <span style="color:#888">['+s.mood.join(", ")+']</span>':"";
    return '<div class="drow"><span style="color:var(--a)">'+s.title+'</span> \u2014 '+s.stage+moods+'</div>';
  }).join("")||'<div class="drow">No song ideas yet</div>';
  pb.innerHTML=
    '<div class="srow"><div class="dot '+cc(ch.overall)+'"></div><span class="srow-label">CHANNEL</span><span class="srow-val">'+(ch.summary||"--")+'</span></div>'+
    '<div class="detail-block">'+chDetail+'</div>'+
    '<div class="srow"><div class="dot '+cc(cm.overall)+'"></div><span class="srow-label">COMMENTS</span><span class="srow-val">'+(cm.summary||"--")+'</span></div>'+
    '<div class="detail-block">'+cmHtml+'</div>'+
    '<div class="srow"><div class="dot '+cc(sg.overall)+'"></div><span class="srow-label">SONG IDEAS</span><span class="srow-val">'+(sg.summary||"--")+'</span></div>'+
    '<div class="detail-block">'+stageHtml+recentHtml+'</div>'+
    '<div class="last-updated">UPDATED '+ts+'</div>';
}
function fetchHollowedGround(){
  fetch("/api/hollowed_ground").then(function(r){if(!r.ok)throw r.status;return r.json();})
    .then(function(d){renderHollowedGround(d);})
    .catch(function(){
      var pb=document.getElementById("pb-hollowed_ground");
      if(pb)pb.innerHTML='<div class="fetch-error">AWAITING DATA FEED</div>';
    });
}
fetchHollowedGround();
setInterval(fetchHollowedGround,300000);
</script></body></html>
